name: Scheduled rescore

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-rescore
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # This job runs every dependency's code while it parses untrusted repos, so
  # its token is read-only; only publish can push.
  rescore:
    runs-on: ubuntu-latest
    # Runs take ~45 min for ~400 repos; the margin keeps a slow host from
    # killing the run, which would throw away every score it had made.
    timeout-minutes: 75
    permissions:
      contents: read
    outputs:
      started-at: ${{ steps.started.outputs.at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.16

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install
        run: bun install --frozen-lockfile

      # Adds any columns the snapshot below names, so it can't fail on a DB
      # committed before they existed.
      - name: Migrate the database
        run: bun run init-db

      # badge_embedded is here despite not being a score: adoption leaves every
      # overall_score identical, so a scores-only diff reads the run as a no-op
      # and discards the flag with the runner, every run, forever. language,
      # description and topics are here for the same reason. url is what makes
      # a pruned or renamed seed count as a change.
      - name: Snapshot pre-rescore state
        run: |
          mkdir -p /tmp/rescore
          sqlite3 data/rank.db "SELECT url, overall_score, badge_embedded, language, description, topics FROM repo ORDER BY url;" > /tmp/rescore/state-before.txt

      - name: Note when the rescore started
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Rescore curated seeds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run seed

      # seed exits without closing the database, so its last writes can still
      # sit in rank.db-wal, which is not uploaded.
      - name: Fold the WAL into rank.db
        run: |
          sqlite3 data/rank.db "PRAGMA wal_checkpoint(TRUNCATE);"
          cp data/rank.db /tmp/rescore/rank.db

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rescore
          path: /tmp/rescore/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: rescore
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.16

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rescore
          path: /tmp/rescore

      - name: Commit and push if the repo set, a score, badge adoption or repo metadata changed
        id: publish
        run: |
          cp /tmp/rescore/rank.db data/rank.db
          sqlite3 data/rank.db "SELECT url, overall_score, badge_embedded, language, description, topics FROM repo ORDER BY url;" > /tmp/state-after.txt
          if diff -q /tmp/rescore/state-before.txt /tmp/state-after.txt > /dev/null; then
            echo "No repo, score, badge-adoption or metadata changes — skipping commit (last_scored_at churn ignored)."
            exit 0
          fi
          bun run check-db-leaks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rank.db
          git commit -m "chore: scheduled rescore $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # The push only starts the deploy. A crawler told about a page before the
      # new build serves it re-reads the old one and has no reason to come back.
      - name: Tell IndexNow which pages changed
        if: steps.publish.outputs.pushed == 'true'
        continue-on-error: true
        env:
          STARTED_AT: ${{ needs.rescore.outputs.started-at }}
        run: |
          sleep 300
          bun run indexnow --since "$STARTED_AT"
