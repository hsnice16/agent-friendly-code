name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint · Format · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.16

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Biome check (lint + format)
        run: bun x @biomejs/biome ci .

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Test
        run: bun run test

      - name: DB leak scan
        run: bun run check-db-leaks

      # tsc does not see what only the bundler sees — a server-only import
      # pulled into a client component, an RSC boundary violation. Without this
      # the first place a broken build shows up is the Vercel deploy.
      - name: Build
        run: bun run build
