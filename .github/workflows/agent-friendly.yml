name: Agent-friendly score diff

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agent-friendly-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  score-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: hsnice16/agent-friendly-action@b276a211cfb3f4db490ba85c638f42367bf0538f # v0.1.12
        with:
          agents-badge-token: ${{ secrets.AGENTS_BADGE_TOKEN }}
